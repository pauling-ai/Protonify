[build-system]
requires = ["setuptools<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protonify"
version = "0.1.0"
description = "Protonation state prediction and microstate distribution for molecules at given pH."
requires-python = ">=3.10"
dependencies = [
    'torch>=2.0.0',
    'numpy>=1.21',
    'pandas>=1.3',
    'scipy>=1.7',
    'rdkit>=2023.0.0',
    'matplotlib>=3.5',
    'Pillow>=9.0',
]

[project.scripts]
protonify = "protonify.__main__:main"
protonify-download = "protonify:ensure_model"

[tool.setuptools]
packages = ["protonify", "protonify.data", "protonify.models", "protonify.tests"]
include-package-data = true

[tool.setuptools.package-data]
"protonify.data" = ["*.tsv"]
"protonify.models" = ["*.pt", ".gitattributes"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]
